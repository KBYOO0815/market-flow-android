name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include the Android SDK and sdkmanager.
      - name: Install Android SDK components
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: |
          npm run check
          npm run check:feeds
      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      # Expo prebuild signs this test release with its debug key.
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify bundled JavaScript and launcher icon
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump resources android/app/build/outputs/apk/release/app-release.apk | grep -q 'mipmap/ic_launcher'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-00-39-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  device:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: market-flow-00-39-test-apk
          path: android/app/build/outputs/apk/release
      - name: Verify live server feed on Android 15
        run: bash scripts/test-device-feed.sh
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-00-39-emulator-evidence
          path: evidence/
          if-no-files-found: ignore

